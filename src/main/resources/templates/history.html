<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">

<title>History</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h2>Assignment History</h2>

    <a href="/dashboard/" class="btn btn-secondary mb-3">
    Dashboard
	</a>

    <table class="table table-bordered">

        <thead>

        <tr>

            <th>ID</th>
            <th>Executive</th>
            <th>Phone</th>
            <th>Assigned Date</th>
            <th>Return Date</th>
            <th>Status</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="h : ${history}">

            <td th:text="${h.id}"></td>

            <td th:text="${h.executive.name}"></td>

            <td th:text="${h.phone.phoneName}"></td>

            <td th:text="${h.assignedDate}"></td>

            <td th:text="${h.returnDate}"></td>

            <td th:text="${h.status}"></td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
