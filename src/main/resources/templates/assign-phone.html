<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Assigned Phones</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>


<body>

<div class="container mt-5">


<h2>Assigned Phones</h2>


<a href="/dashboard" class="btn btn-secondary mb-3">
Dashboard
</a>


<table class="table table-bordered">


<thead>

<tr>

<th>ID</th>
<th>Executive</th>
<th>Phone</th>
<th>Assigned Date</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>



<tbody>


<tr th:each="a : ${assignments}">


<td th:text="${a.id}"></td>


<td th:text="${a.executive.name}"></td>


<td th:text="${a.phone.phoneName}"></td>


<td th:text="${a.assignedDate}"></td>


<td th:text="${a.status}"></td>


<td>

<a th:href="@{/assignments/return/{id}(id=${a.id})}"
class="btn btn-danger">

Return

</a>

</td>


</tr>


</tbody>


</table>


</div>


</body>

</html>
