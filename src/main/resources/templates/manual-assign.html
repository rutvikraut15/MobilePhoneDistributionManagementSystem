<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Manual Phone Assignment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>


<body>


<div class="container mt-5">


<h2>Manual Phone Assignment</h2>


<a href="/dashboard/" class="btn btn-secondary mb-3">
    Dashboard
	</a>



<form action="/assignments/manual-save" method="post">



<!-- Executive Selection -->

<div class="mb-3">

<label class="form-label">
Select Executive
</label>


<select name="executiveId" class="form-control" required>


<option value="">
-- Select Executive --
</option>


<option th:each="e : ${executives}"
        th:value="${e.id}"
        th:text="${e.name}">
</option>


</select>

</div>




<!-- Phone Selection -->

<div class="mb-3">

<label class="form-label">
Select Available Phone
</label>


<select name="phoneId" class="form-control" required>


<option value="">
-- Select Phone --
</option>


<option th:each="p : ${phones}"
        th:value="${p.id}"
        th:text="${p.phoneName}">
</option>


</select>


</div>




<button type="submit" class="btn btn-primary">
Assign Phone
</button>



</form>



</div>


</body>

</html>
