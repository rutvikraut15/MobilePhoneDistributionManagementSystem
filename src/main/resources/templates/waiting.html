<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">

<title>Waiting List</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>Waiting List</h2>

<a href="/dashboard/" class="btn btn-secondary mb-3">
    Dashboard
</a>

<table class="table table-bordered">

<thead>

<tr>

<th>ID</th>

<th>Executive</th>

<th>Date</th>

<th>Reason</th>

</tr>

</thead>

<tbody>

<tr th:each="w : ${waitingList}">

<td th:text="${w.id}"></td>

<td th:text="${w.executive != null ? w.executive.name : 'N/A'}"></td>

<td th:text="${w.waitingDate}"></td>

<td th:text="${w.reason}"></td>

</tr>

</tbody>

</table>

</div>

</body>
</html>
